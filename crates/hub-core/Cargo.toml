[package]
name = "hub-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# `unstable_end_turn_token_usage`: the prompt response's `usage`, the tokens of the turn (`TurnEndData.usage`).
agent-client-protocol = { workspace = true, features = ["unstable_end_turn_token_usage"] }
anyhow.workspace = true
base64.workspace = true
hub-install.workspace = true
axum.workspace = true
flate2.workspace = true
brotli-decompressor.workspace = true
futures.workspace = true
ignore.workspace = true
netstat2.workspace = true
portable-pty.workspace = true
qrcode.workspace = true
regex.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
rusqlite_migration.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sysinfo.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
toml.workspace = true
tower-http.workspace = true
tracing.workspace = true
ts-rs.workspace = true
uuid.workspace = true
calamine = "0.38.0"

[target.'cfg(windows)'.dependencies]
win32job = "2"
keyring = { version = "3", features = ["windows-native"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
