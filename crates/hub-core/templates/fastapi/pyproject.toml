[project]
name = "{{slug}}"
version = "0.1.0"
description = "{{name}}"
requires-python = ">=3.11"
dependencies = ["fastapi[standard]>=0.115"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
